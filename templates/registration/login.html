{% extends "base.html" %}
{% block title %}CASBAH &mdash; Log in{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:2rem auto;">
    <h1>Log in</h1>
    {% if form.errors %}
    <p style="color:#c0392b; font-weight:bold;">&#10060; Invalid username or password.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <p>
            <label for="{{ form.username.id_for_label }}">Username</label><br>
            {{ form.username }}
        </p>
        <p>
            <label for="{{ form.password.id_for_label }}">Password</label><br>
            {{ form.password }}
        </p>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn" type="submit">Log in</button>
    </form>
</div>
{% endblock %}
